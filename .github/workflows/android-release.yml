name: Android APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monty-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK and accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: npm ci
      - run: npm run check
      - name: Core and updater tests (personal PDF fixtures are not published)
        run: npx vitest run --exclude tests/parser.test.ts --exclude tests/monty-parser.test.ts
      - run: npm run android:sync
      - name: Native tests and Android lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon
      - name: Restore release signing key from the repository secret
        env:
          MONTY_SIGNING_BUNDLE: ${{ secrets.MONTY_SIGNING_BUNDLE }}
          MONTY_SIGNING_KEY: ${{ secrets.MONTY_SIGNING_KEY }}
        run: node scripts/restore-android-signing.mjs
      - name: Read version
        id: version
        run: |
          node -e 'const fs=require("fs"),v=require("./android-version.json");if(!/^\d+\.\d+\.\d+$/.test(v.versionName)||!Number.isSafeInteger(v.versionCode)||v.versionCode<=0)throw Error("Invalid version");fs.appendFileSync(process.env.GITHUB_OUTPUT,`name=${v.versionName}\ncode=${v.versionCode}\n`);'
      - name: Signed APK builds
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PmontyVersionName=${{ steps.version.outputs.name }} -PmontyVersionCode=${{ steps.version.outputs.code }}
      - run: node scripts/package-android-release.mjs
      - name: Verify signatures and Android 16 native library alignment
        run: |
          for apk in release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          done
          python3 scripts/check-android-elf.py release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Monty-${{ steps.version.outputs.name }}-APKs
          path: |
            release/*.apk
            release/update.json
            release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish a complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tag="v$VERSION"
          monty_draft_state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$monty_draft_state" = false ]; then
            echo "Release $tag already exists. APKs are available as this run's artifacts. Increase both fields in android-version.json to publish an update."
            exit 0
          fi
          if gh release download --pattern update.json --dir "$RUNNER_TEMP/previous-release" > /dev/null 2>&1; then
            python3 - <<'PY'
          import json,os,pathlib
          previous=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'previous-release/update.json').read_text())
          if int(os.environ['VERSION_CODE']) <= previous['versionCode']: raise SystemExit('versionCode must increase for every new release.')
          PY
          fi
          if [ "$monty_draft_state" = true ]; then
            gh release upload "$tag" release/*.apk release/update.json release/SHA256SUMS.txt --clobber
            gh release edit "$tag" --title "Monty $VERSION" --notes-file release/release-notes.md
          else
            gh release create "$tag" release/*.apk release/update.json release/SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title "Monty $VERSION" --notes-file release/release-notes.md
          fi
          gh release edit "$tag" --draft=false --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/monty-release.jks"
